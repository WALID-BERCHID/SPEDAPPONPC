<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verify a certificate · Hand in Hand</title>
<link rel="icon" href="icon.svg" />
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:rgba(60,60,67,.62); --blue:#007aff; --green:#248a3d; --red:#d70015; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#fff; --muted:rgba(235,235,245,.6); --blue:#0a84ff; --green:#30d158; --red:#ff453a; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:16px; }
  main { width:min(520px,100%); background:var(--card); border-radius:24px; padding:32px; box-shadow:0 24px 64px rgba(0,0,0,.12); display:flex; flex-direction:column; gap:18px; }
  img { width:64px; height:64px; border-radius:16px; align-self:center; }
  h1 { margin:0; text-align:center; font-size:1.6rem; }
  p { margin:0; } .muted { color:var(--muted); text-align:center; }
  form { display:flex; gap:8px; }
  input { flex:1; font:inherit; font-size:1.1rem; letter-spacing:.1em; text-transform:uppercase; padding:10px 14px; border-radius:12px; border:1px solid transparent; background:rgba(118,118,128,.12); color:inherit; }
  button { font:inherit; font-weight:600; border:none; border-radius:12px; padding:10px 18px; background:var(--blue); color:#fff; cursor:pointer; }
  .result { border-radius:16px; padding:18px; background:rgba(118,118,128,.1); display:none; flex-direction:column; gap:8px; }
  .ok { color:var(--green); font-weight:700; } .bad { color:var(--red); font-weight:700; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; margin:0; } dt { color:var(--muted); } dd { margin:0; font-weight:600; }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="" />
  <h1>Verify a certificate</h1>
  <p class="muted">Enter the certificate ID printed at the bottom of a Hand in Hand contribution certificate.</p>
  <form id="f"><input id="code" placeholder="e.g. 3F9A1C0B7E" autocomplete="off" required /><button>Check</button></form>
  <div class="result" id="r"></div>
  <p class="muted" style="font-size:.8rem">Certificates record volunteer contribution in the Hand in Hand community. They are not professional qualifications.</p>
</main>
<script src="config.js"></script>
<script>
  const r = document.getElementById("r");
  const show = (html) => { r.style.display = "flex"; r.innerHTML = html; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  async function check(code) {
    const { url, key } = window.HIH_CONFIG || {};
    if (!url || !key) return show('<span class="bad">The verification service is not set up yet.</span>');
    show('<span class="muted">Checking…</span>');
    try {
      const res = await fetch(url + "/rest/v1/rpc/verify_certificate", {
        method: "POST",
        headers: { apikey: key, Authorization: "Bearer " + key, "Content-Type": "application/json" },
        body: JSON.stringify({ p_code: code }),
      });
      const rows = await res.json();
      if (!Array.isArray(rows) || !rows.length) return show('<span class="bad">✗ No certificate with this ID.</span>');
      const c = rows[0];
      show(`<span class="ok">✓ Valid certificate</span><dl>
        <dt>Name</dt><dd>${esc(c.display_name)}${c.verified ? " ✓" : ""}</dd>
        <dt>Role</dt><dd>${esc(c.verified && c.specialty ? c.specialty : c.role)}</dd>
        <dt>Level</dt><dd>${esc(c.level)} · ${c.points} points</dd>
        <dt>Answers</dt><dd>${c.answers} (${c.accepted} marked most helpful)</dd>
        <dt>Helpful votes</dt><dd>${c.helpful}</dd>
        <dt>Live sessions</dt><dd>${c.sessions} (${c.hours} h)</dd>
        <dt>Issued</dt><dd>${new Date(c.issued_at).toLocaleDateString()}</dd></dl>`);
    } catch { show('<span class="bad">Could not reach the server. Try again later.</span>'); }
  }
  document.getElementById("f").onsubmit = (e) => { e.preventDefault(); check(document.getElementById("code").value.trim()); };
  const q = new URLSearchParams(location.search).get("code");
  if (q) { document.getElementById("code").value = q; check(q); }
</script>
</body>
</html>
