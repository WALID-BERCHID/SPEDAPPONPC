[package]
name = "hand-in-hand"
version = "0.2.0"
description = "Free, private organiser for families and teachers of children with special needs"
edition = "2021"

[lib]
name = "hand_in_hand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
